name: Image Docker

# Publie l'image sur GHCR a chaque push sur main, puis deploie en production.
# Les tests tournent d'abord : une image cassee ne doit jamais atteindre le
# registre, encore moins pendant la saison ou le conteneur redemarre tout seul.
#
# Secrets attendus pour le job « deployer » : DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY, et DEPLOY_KNOWN_HOSTS (facultatif mais recommande).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # En minuscules et en dur : GHCR refuse les majuscules, et le proprietaire du
  # depot s'ecrit « AltToni ».
  IMAGE_NAME: alttoni/nflprono

jobs:
  verifier:
    name: Tests et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Tests unitaires
        run: npm test

  publier:
    name: Build et publication
    runs-on: ubuntu-latest
    needs: verifier
    # Rien ne part au registre depuis une pull request : on veut valider le
    # Dockerfile sans polluer les tags ni exposer le jeton en ecriture.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha long : un tag immuable auquel epingler la production.
          # latest : uniquement sur main, pour un `docker compose pull` simple.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Pronos NFL
            org.opencontainers.image.description=Jeu de pronostics NFL prive

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # better-sqlite3 se compile depuis les sources sur alpine : sans cache,
          # chaque build repart de zero pour plusieurs minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 seulement. Ajouter linux/arm64 ici si la cible devient un
          # Raspberry Pi ou un VPS ARM — mais l'emulation QEMU rend la
          # compilation de better-sqlite3 tres lente (compter ~15 min).
          platforms: linux/amd64

      - name: Recapitulatif
        run: |
          echo "### Image publiee" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploiement : automatique, voir le job « Deploiement en production »." >> $GITHUB_STEP_SUMMARY

  fumee:
    name: Test de fumee du compose de production
    runs-on: ubuntu-latest
    needs: publier
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    env:
      # On teste le tag immuable qui vient d'etre publie, pas `latest`.
      IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE: docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v5

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparer un environnement jetable
        run: |
          mkdir -p backup && sudo chown 1000:1000 backup
          cat > .env <<EOF
          PUBLIC_BASE_URL=http://localhost:3000
          AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ADMIN_EMAIL=ci@example.invalid
          ADMIN_PSEUDO=admin
          SEASON_YEAR=2026
          CRON_ENABLED=0
          EOF

      - name: Valider le compose
        run: docker compose -f $COMPOSE config > /dev/null

      - name: Demarrer
        run: docker compose -f $COMPOSE up -d

      - name: Attendre l'etat healthy
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' nfl-pronos 2>/dev/null || echo absent)
            echo "tentative $i : $etat"
            [ "$etat" = healthy ] && exit 0
            [ "$etat" = unhealthy ] && break
            sleep 5
          done
          echo "::error::le conteneur n'est jamais devenu healthy"
          exit 1

      - name: Verifier les reponses HTTP
        run: |
          echo "--- /api/health"
          curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
          echo "--- / (doit rediriger vers /connexion)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          [ "$code" = 303 ] || { echo "::error::attendu 303, obtenu $code"; exit 1; }
          echo "--- migrations et compte admin"
          docker compose -f $COMPOSE logs app | grep -E "migration|administrateur|Application prete"

      - name: Verifier qu'un formulaire est accepte
        # Regression : sans ORIGIN, adapter-node reconstitue l'origine en http://
        # depuis l'en-tete Host et la verification CSRF rejette *tous* les
        # formulaires en 403. Un GET ne le voit pas, seul un POST le montre.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST 'http://127.0.0.1:3000/connexion?/lien' \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'email=ci@example.invalid')
          echo "POST /connexion?/lien -> $code"
          [ "$code" = 403 ] && { echo "::error::CSRF rejette les formulaires : ORIGIN est-il defini ?"; exit 1; }
          [ "$code" = 200 ] || { echo "::error::attendu 200, obtenu $code"; exit 1; }

      - name: Verifier les en-tetes de securite
        run: |
          entetes=$(curl -s -D - -o /dev/null http://127.0.0.1:3000/connexion)
          echo "$entetes" | grep -qi '^content-security-policy:' || { echo "::error::CSP absent"; exit 1; }
          echo "$entetes" | grep -qi "^content-security-policy:.*frame-ancestors 'none'" \
            || { echo "::error::frame-ancestors manquant"; exit 1; }
          echo "$entetes" | grep -qi '^x-content-type-options: nosniff' || { echo "::error::nosniff absent"; exit 1; }
          echo "$entetes" | grep -qi '^referrer-policy:' || { echo "::error::Referrer-Policy absent"; exit 1; }
          echo "$entetes" | grep -iE '^(content-security-policy|x-|referrer-policy|permissions-policy)'

      - name: Journal du conteneur
        if: always()
        run: docker compose -f $COMPOSE logs --tail=60 app || true

      - name: Arret et nettoyage
        if: always()
        run: docker compose -f $COMPOSE down -v || true

  sauvegarde:
    name: Aller-retour sauvegarde et restauration
    runs-on: ubuntu-latest
    needs: publier
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE: docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck scripts/backup.sh scripts/restore.sh

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Demarrer la pile
        run: |
          mkdir -p backup && sudo chown 1000:1000 backup
          cat > .env <<EOF
          PUBLIC_BASE_URL=http://localhost:3000
          AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ADMIN_EMAIL=ci@example.invalid
          SEASON_YEAR=2026
          CRON_ENABLED=0
          EOF
          docker compose -f $COMPOSE up -d
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nfl-pronos)" = healthy ] && break
            sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' nfl-pronos | grep -q healthy

      - name: Poser un marqueur avant la sauvegarde
        run: |
          docker exec nfl-pronos sqlite3 /data/nfl.db \
            "insert into settings (key, value, updated_at) values ('ci.marqueur', 'avant', 0);"
          echo "marqueur : $(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select value from settings where key='ci.marqueur';")"
          echo "joueurs  : $(docker exec nfl-pronos sqlite3 /data/nfl.db 'select count(*) from users;')"

      - name: Sauvegarder
        run: |
          mkdir -p "$RUNNER_TEMP/distant"
          sudo -E env "PATH=$PATH" \
            KEEP_DAYS=30 \
            REMOTE_TARGET="$RUNNER_TEMP/distant" \
            ./scripts/backup.sh
          echo "--- local"
          ls -l backup/nocturne/
          echo "--- distant"
          ls -l "$RUNNER_TEMP/distant/"
          test -n "$(ls backup/nocturne/nflprono-*.db.gz 2>/dev/null)" \
            || { echo "::error::aucune sauvegarde produite"; exit 1; }
          test -n "$(ls "$RUNNER_TEMP"/distant/nflprono-*.db.gz 2>/dev/null)" \
            || { echo "::error::rien n'a ete copie a distance"; exit 1; }

      - name: Modifier la base apres la sauvegarde
        run: |
          docker exec nfl-pronos sqlite3 /data/nfl.db \
            "update settings set value='apres' where key='ci.marqueur';
             insert into users (pseudo, email, role, active, created_at)
             values ('AjouteApres', 'apres@example.invalid', 'joueur', 1, 0);"
          echo "marqueur : $(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select value from settings where key='ci.marqueur';")"
          echo "joueurs  : $(docker exec nfl-pronos sqlite3 /data/nfl.db 'select count(*) from users;')"

      - name: Restaurer
        run: sudo -E env "PATH=$PATH" ./scripts/restore.sh --latest --yes

      - name: Verifier que l'etat d'avant est revenu
        run: |
          MARQUEUR=$(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select value from settings where key='ci.marqueur';")
          JOUEURS=$(docker exec nfl-pronos sqlite3 /data/nfl.db 'select count(*) from users;')
          AJOUTE=$(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select count(*) from users where pseudo='AjouteApres';")
          echo "marqueur=$MARQUEUR joueurs=$JOUEURS ajoute_apres=$AJOUTE"
          [ "$MARQUEUR" = "avant" ] || { echo "::error::marqueur=$MARQUEUR, attendu « avant »"; exit 1; }
          [ "$AJOUTE" = "0" ] || { echo "::error::le joueur ajoute apres la sauvegarde est toujours la"; exit 1; }
          [ "$JOUEURS" = "1" ] || { echo "::error::joueurs=$JOUEURS, attendu 1"; exit 1; }
          echo "--- l'application repond toujours"
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          echo "--- copie de securite de la base d'avant restauration"
          ls -l backup/avant-restauration-*.db

      - name: Journal du conteneur
        if: always()
        run: docker compose -f $COMPOSE logs --tail=40 app || true

      - name: Arret et nettoyage
        if: always()
        run: docker compose -f $COMPOSE down -v || true

  deployer:
    name: Deploiement en production
    runs-on: ubuntu-latest
    # Toute la chaine doit etre verte : les tests, l'image publiee sur GHCR, et
    # les deux jobs qui exercent le compose de production. `needs` echoue en
    # cascade, donc un rouge n'importe ou en amont annule le deploiement.
    needs: [verifier, publier, fumee, sauvegarde]
    # Push sur main, ou lancement manuel depuis l'onglet Actions. Jamais depuis
    # une pull request, ni depuis une branche lancee a la main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    # Un seul deploiement a la fois. Si deux push s'enchainent, le second annule
    # le premier : mieux vaut perdre un deploiement intermediaire que voir deux
    # `docker compose up -d` se marcher dessus sur la meme machine.
    concurrency:
      group: deploiement-production
      cancel-in-progress: true

    permissions:
      contents: read

    env:
      # Doit correspondre a PUBLIC_BASE_URL sur le serveur, sinon la verification
      # CSRF du test de fumee rejettera le POST.
      URL_PUBLIQUE: https://prono.tyvia.eu

    steps:
      - name: Preparer la cle SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::secret DEPLOY_HOST absent"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::secret DEPLOY_SSH_KEY absent"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          # Empreinte epinglee si le secret existe. Sinon on interroge le serveur
          # au moment du deploiement : plus simple a mettre en place, mais ca ne
          # protege plus d'un detournement au premier contact.
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS absent, empreinte SSH acceptee sans verification"
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Tirer l'image et redemarrer la pile
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploiement -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -euo pipefail; cd /opt/nflprono && docker compose pull && docker compose up -d'

      - name: Attendre que l'application reponde
        run: |
          # `up -d` rend la main des que le conteneur est cree ; les migrations
          # et l'ouverture de la base prennent encore quelques secondes.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "$URL_PUBLIQUE/api/health" || echo 000)
            echo "tentative $i : /api/health -> $code"
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          echo "::error::/api/health n'a pas repondu 200 en 60 s"
          exit 1

      - name: Verifier qu'un formulaire est accepte
        # Meme controle que le job « fumee », mais contre la vraie URL publique :
        # c'est le seul endroit ou le reverse proxy, ORIGIN et le certificat TLS
        # sont reellement dans la boucle. L'adresse est inconnue de la base, donc
        # aucun mail n'est envoye — la reponse est identique par construction.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$URL_PUBLIQUE/connexion?/lien" \
            -H "Origin: $URL_PUBLIQUE" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'email=deploiement@example.invalid')
          echo "POST /connexion?/lien -> $code"
          [ "$code" = 403 ] && { echo "::error::CSRF rejette les formulaires : PUBLIC_BASE_URL correspond-il a $URL_PUBLIQUE ?"; exit 1; }
          [ "$code" = 200 ] || { echo "::error::attendu 200, obtenu $code"; exit 1; }

      - name: Recapitulatif
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "### Deploiement reussi" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deploiement en echec" >> $GITHUB_STEP_SUMMARY
            echo "La pile a peut-etre deja redemarre : verifier l'etat du serveur." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL : $URL_PUBLIQUE" >> $GITHUB_STEP_SUMMARY
          echo "- Image : \`sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
