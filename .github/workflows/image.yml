name: Image Docker

# Publie l'image sur GHCR a chaque push sur main. Les tests tournent d'abord :
# une image cassee ne doit jamais atteindre le registre, encore moins pendant la
# saison ou le conteneur redemarre tout seul.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # En minuscules et en dur : GHCR refuse les majuscules, et le proprietaire du
  # depot s'ecrit « AltToni ».
  IMAGE_NAME: alttoni/nflprono

jobs:
  verifier:
    name: Tests et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Tests unitaires
        run: npm test

  publier:
    name: Build et publication
    runs-on: ubuntu-latest
    needs: verifier
    # Rien ne part au registre depuis une pull request : on veut valider le
    # Dockerfile sans polluer les tags ni exposer le jeton en ecriture.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha long : un tag immuable auquel epingler la production.
          # latest : uniquement sur main, pour un `docker compose pull` simple.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Pronos NFL
            org.opencontainers.image.description=Jeu de pronostics NFL prive

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # better-sqlite3 se compile depuis les sources sur alpine : sans cache,
          # chaque build repart de zero pour plusieurs minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 seulement. Ajouter linux/arm64 ici si la cible devient un
          # Raspberry Pi ou un VPS ARM — mais l'emulation QEMU rend la
          # compilation de better-sqlite3 tres lente (compter ~15 min).
          platforms: linux/amd64

      - name: Recapitulatif
        run: |
          echo "### Image publiee" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploiement : \`docker compose pull && docker compose up -d\`" >> $GITHUB_STEP_SUMMARY

  fumee:
    name: Test de fumee du compose de production
    runs-on: ubuntu-latest
    needs: publier
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    env:
      # On teste le tag immuable qui vient d'etre publie, pas `latest`.
      IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE: docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v5

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparer un environnement jetable
        run: |
          mkdir -p backup && sudo chown 1000:1000 backup
          cat > .env <<EOF
          PUBLIC_BASE_URL=http://localhost:3000
          AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ADMIN_EMAIL=ci@example.invalid
          ADMIN_PSEUDO=admin
          SEASON_YEAR=2026
          CRON_ENABLED=0
          EOF

      - name: Valider le compose
        run: docker compose -f $COMPOSE config > /dev/null

      - name: Demarrer
        run: docker compose -f $COMPOSE up -d

      - name: Attendre l'etat healthy
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' nfl-pronos 2>/dev/null || echo absent)
            echo "tentative $i : $etat"
            [ "$etat" = healthy ] && exit 0
            [ "$etat" = unhealthy ] && break
            sleep 5
          done
          echo "::error::le conteneur n'est jamais devenu healthy"
          exit 1

      - name: Verifier les reponses HTTP
        run: |
          echo "--- /api/health"
          curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
          echo "--- / (doit rediriger vers /connexion)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          [ "$code" = 303 ] || { echo "::error::attendu 303, obtenu $code"; exit 1; }
          echo "--- migrations et compte admin"
          docker compose -f $COMPOSE logs app | grep -E "migration|administrateur|Application prete"

      - name: Journal du conteneur
        if: always()
        run: docker compose -f $COMPOSE logs --tail=60 app || true

      - name: Arret et nettoyage
        if: always()
        run: docker compose -f $COMPOSE down -v || true
