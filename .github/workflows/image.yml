name: Image Docker

# Publie l'image sur GHCR a chaque push sur main. Les tests tournent d'abord :
# une image cassee ne doit jamais atteindre le registre, encore moins pendant la
# saison ou le conteneur redemarre tout seul.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # En minuscules et en dur : GHCR refuse les majuscules, et le proprietaire du
  # depot s'ecrit « AltToni ».
  IMAGE_NAME: alttoni/nflprono

jobs:
  verifier:
    name: Tests et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Tests unitaires
        run: npm test

  publier:
    name: Build et publication
    runs-on: ubuntu-latest
    needs: verifier
    # Rien ne part au registre depuis une pull request : on veut valider le
    # Dockerfile sans polluer les tags ni exposer le jeton en ecriture.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha long : un tag immuable auquel epingler la production.
          # latest : uniquement sur main, pour un `docker compose pull` simple.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Pronos NFL
            org.opencontainers.image.description=Jeu de pronostics NFL prive

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # better-sqlite3 se compile depuis les sources sur alpine : sans cache,
          # chaque build repart de zero pour plusieurs minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 seulement. Ajouter linux/arm64 ici si la cible devient un
          # Raspberry Pi ou un VPS ARM — mais l'emulation QEMU rend la
          # compilation de better-sqlite3 tres lente (compter ~15 min).
          platforms: linux/amd64

      - name: Recapitulatif
        run: |
          echo "### Image publiee" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploiement : \`docker compose pull && docker compose up -d\`" >> $GITHUB_STEP_SUMMARY

  fumee:
    name: Test de fumee du compose de production
    runs-on: ubuntu-latest
    needs: publier
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    env:
      # On teste le tag immuable qui vient d'etre publie, pas `latest`.
      IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE: docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v5

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparer un environnement jetable
        run: |
          mkdir -p backup && sudo chown 1000:1000 backup
          cat > .env <<EOF
          PUBLIC_BASE_URL=http://localhost:3000
          AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ADMIN_EMAIL=ci@example.invalid
          ADMIN_PSEUDO=admin
          SEASON_YEAR=2026
          CRON_ENABLED=0
          EOF

      - name: Valider le compose
        run: docker compose -f $COMPOSE config > /dev/null

      - name: Demarrer
        run: docker compose -f $COMPOSE up -d

      - name: Attendre l'etat healthy
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' nfl-pronos 2>/dev/null || echo absent)
            echo "tentative $i : $etat"
            [ "$etat" = healthy ] && exit 0
            [ "$etat" = unhealthy ] && break
            sleep 5
          done
          echo "::error::le conteneur n'est jamais devenu healthy"
          exit 1

      - name: Verifier les reponses HTTP
        run: |
          echo "--- /api/health"
          curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
          echo "--- / (doit rediriger vers /connexion)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          [ "$code" = 303 ] || { echo "::error::attendu 303, obtenu $code"; exit 1; }
          echo "--- migrations et compte admin"
          docker compose -f $COMPOSE logs app | grep -E "migration|administrateur|Application prete"

      - name: Verifier qu'un formulaire est accepte
        # Regression : sans ORIGIN, adapter-node reconstitue l'origine en http://
        # depuis l'en-tete Host et la verification CSRF rejette *tous* les
        # formulaires en 403. Un GET ne le voit pas, seul un POST le montre.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST 'http://127.0.0.1:3000/connexion?/lien' \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'email=ci@example.invalid')
          echo "POST /connexion?/lien -> $code"
          [ "$code" = 403 ] && { echo "::error::CSRF rejette les formulaires : ORIGIN est-il defini ?"; exit 1; }
          [ "$code" = 200 ] || { echo "::error::attendu 200, obtenu $code"; exit 1; }

      - name: Verifier les en-tetes de securite
        run: |
          entetes=$(curl -s -D - -o /dev/null http://127.0.0.1:3000/connexion)
          echo "$entetes" | grep -qi '^content-security-policy:' || { echo "::error::CSP absent"; exit 1; }
          echo "$entetes" | grep -qi "^content-security-policy:.*frame-ancestors 'none'" \
            || { echo "::error::frame-ancestors manquant"; exit 1; }
          echo "$entetes" | grep -qi '^x-content-type-options: nosniff' || { echo "::error::nosniff absent"; exit 1; }
          echo "$entetes" | grep -qi '^referrer-policy:' || { echo "::error::Referrer-Policy absent"; exit 1; }
          echo "$entetes" | grep -iE '^(content-security-policy|x-|referrer-policy|permissions-policy)'

      - name: Journal du conteneur
        if: always()
        run: docker compose -f $COMPOSE logs --tail=60 app || true

      - name: Arret et nettoyage
        if: always()
        run: docker compose -f $COMPOSE down -v || true

  sauvegarde:
    name: Aller-retour sauvegarde et restauration
    runs-on: ubuntu-latest
    needs: publier
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE: docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck scripts/backup.sh scripts/restore.sh

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Demarrer la pile
        run: |
          mkdir -p backup && sudo chown 1000:1000 backup
          cat > .env <<EOF
          PUBLIC_BASE_URL=http://localhost:3000
          AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ADMIN_EMAIL=ci@example.invalid
          SEASON_YEAR=2026
          CRON_ENABLED=0
          EOF
          docker compose -f $COMPOSE up -d
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nfl-pronos)" = healthy ] && break
            sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' nfl-pronos | grep -q healthy

      - name: Poser un marqueur avant la sauvegarde
        run: |
          docker exec nfl-pronos sqlite3 /data/nfl.db \
            "insert into settings (key, value, updated_at) values ('ci.marqueur', 'avant', 0);"
          echo "marqueur : $(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select value from settings where key='ci.marqueur';")"
          echo "joueurs  : $(docker exec nfl-pronos sqlite3 /data/nfl.db 'select count(*) from users;')"

      - name: Sauvegarder
        run: |
          mkdir -p "$RUNNER_TEMP/distant"
          sudo -E env "PATH=$PATH" \
            KEEP_DAYS=30 \
            REMOTE_TARGET="$RUNNER_TEMP/distant" \
            ./scripts/backup.sh
          echo "--- local"
          ls -l backup/nocturne/
          echo "--- distant"
          ls -l "$RUNNER_TEMP/distant/"
          test -n "$(ls backup/nocturne/nflprono-*.db.gz 2>/dev/null)" \
            || { echo "::error::aucune sauvegarde produite"; exit 1; }
          test -n "$(ls "$RUNNER_TEMP"/distant/nflprono-*.db.gz 2>/dev/null)" \
            || { echo "::error::rien n'a ete copie a distance"; exit 1; }

      - name: Modifier la base apres la sauvegarde
        run: |
          docker exec nfl-pronos sqlite3 /data/nfl.db \
            "update settings set value='apres' where key='ci.marqueur';
             insert into users (pseudo, email, role, active, created_at)
             values ('AjouteApres', 'apres@example.invalid', 'joueur', 1, 0);"
          echo "marqueur : $(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select value from settings where key='ci.marqueur';")"
          echo "joueurs  : $(docker exec nfl-pronos sqlite3 /data/nfl.db 'select count(*) from users;')"

      - name: Restaurer
        run: sudo -E env "PATH=$PATH" ./scripts/restore.sh --latest --yes

      - name: Verifier que l'etat d'avant est revenu
        run: |
          MARQUEUR=$(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select value from settings where key='ci.marqueur';")
          JOUEURS=$(docker exec nfl-pronos sqlite3 /data/nfl.db 'select count(*) from users;')
          AJOUTE=$(docker exec nfl-pronos sqlite3 /data/nfl.db \
            "select count(*) from users where pseudo='AjouteApres';")
          echo "marqueur=$MARQUEUR joueurs=$JOUEURS ajoute_apres=$AJOUTE"
          [ "$MARQUEUR" = "avant" ] || { echo "::error::marqueur=$MARQUEUR, attendu « avant »"; exit 1; }
          [ "$AJOUTE" = "0" ] || { echo "::error::le joueur ajoute apres la sauvegarde est toujours la"; exit 1; }
          [ "$JOUEURS" = "1" ] || { echo "::error::joueurs=$JOUEURS, attendu 1"; exit 1; }
          echo "--- l'application repond toujours"
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          echo "--- copie de securite de la base d'avant restauration"
          ls -l backup/avant-restauration-*.db

      - name: Journal du conteneur
        if: always()
        run: docker compose -f $COMPOSE logs --tail=40 app || true

      - name: Arret et nettoyage
        if: always()
        run: docker compose -f $COMPOSE down -v || true

  deployer:
    name: Deploiement sur le VPS
    runs-on: ubuntu-latest
    # Rien ne part en production sans que la fumee et l'aller-retour de
    # sauvegarde soient passes : c'est la meme logique qu'entre `verifier` et
    # `publier`, une image cassee ne doit pas atteindre le VPS.
    needs: [fumee, sauvegarde]
    # Push sur main et declenchement manuel. Le `ref` est reverifie parce que
    # workflow_dispatch accepte n'importe quelle branche : un essai lance depuis
    # une branche ne doit pas se retrouver en production.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}

    # Deux deploiements simultanes se marcheraient dessus sur la meme machine.
    # Sans annulation : un `compose up` interrompu laisse la pile a moitie a jour.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    env:
      # Le tag immuable qui vient de passer la fumee, jamais `latest` : entre le
      # build et ce job, un autre push a pu deplacer `latest`.
      IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE: docker-compose.prod.yml
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/nfl-pronos' }}
      BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}

    steps:
      - name: Verifier la configuration
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          manquant=
          [ -n "$VPS_HOST" ] || manquant="$manquant secrets.VPS_HOST"
          [ -n "$VPS_USER" ] || manquant="$manquant secrets.VPS_USER"
          [ -n "$SSH_KEY" ]  || manquant="$manquant secrets.VPS_SSH_KEY"
          [ -n "$BASE_URL" ] || manquant="$manquant vars.PUBLIC_BASE_URL"
          if [ -n "$manquant" ]; then
            echo "::error::configuration incomplete :$manquant"
            exit 1
          fi
          # Un slash final donnerait des URL en `//api/health` et surtout un
          # en-tete Origin qui ne correspondrait plus a ORIGIN cote conteneur.
          case "$BASE_URL" in
            */) echo "::error::vars.PUBLIC_BASE_URL ne doit pas finir par /"; exit 1 ;;
          esac
          echo "cible : $VPS_USER@***:$VPS_PORT  ->  $APP_DIR"
          echo "url   : $BASE_URL"

      - name: Preparer l'acces SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Passage par une variable d'environnement plutot qu'une substitution
          # directe dans le script : le shell n'a jamais a interpreter la cle.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Sans empreinte connue d'avance, on fait confiance a celle qui se
            # presente : un intermediaire pourrait se faire passer pour le VPS et
            # recuperer le contenu de la session. Fermer la porte en renseignant
            # VPS_KNOWN_HOSTS avec la sortie de `ssh-keyscan -p 22 le.vps.eu`.
            echo "::warning::VPS_KNOWN_HOSTS absent : l'empreinte du serveur n'est pas verifiee."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2> /dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Tirer l'image et relancer le compose
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Le jeton est injecte en tete du script, pas en argument de ssh : il
          # ne passe donc pas par la ligne de commande visible dans le `ps` du VPS.
          {
            printf "GHCR_TOKEN='%s'\n" "$GHCR_TOKEN"
            cat <<'DISTANT'
          cd "$APP_DIR"
          test -f "$COMPOSE" || { echo "::error::$APP_DIR/$COMPOSE introuvable"; exit 1; }
          test -f .env       || { echo "::error::$APP_DIR/.env introuvable"; exit 1; }

          # Identifiants isoles dans un DOCKER_CONFIG jetable. Le VPS a deja un
          # `docker login ghcr.io` avec un PAT durable (README section 6) : se
          # connecter dans ~/.docker/config.json l'ecraserait par le jeton de ce
          # job, qui expire a la fin du run, et le prochain `docker compose pull`
          # lance a la main echouerait.
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          echo "image en place avant deploiement : $(docker inspect -f '{{.Config.Image}}' nfl-pronos 2>/dev/null || echo aucune)"

          # Epingle la version dans .env : un `docker compose up -d` lance a la
          # main plus tard repart alors sur la meme image, et non sur `latest`.
          # Reecriture par-dessus le fichier plutot qu'un `mv` : on garde l'inode,
          # le proprietaire et les droits du .env existant, qui porte AUTH_SECRET.
          cp -p .env .env.avant-deploiement
          tampon=$(mktemp)
          { grep -v '^IMAGE_TAG=' .env || true; echo "IMAGE_TAG=$IMAGE_TAG"; } > "$tampon"
          cat "$tampon" > .env
          rm -f "$tampon"

          docker compose -f "$COMPOSE" pull
          docker compose -f "$COMPOSE" up -d --remove-orphans

          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' nfl-pronos 2>/dev/null || echo absent)
            echo "tentative $i : $etat"
            [ "$etat" = healthy ] && break
            [ "$etat" = unhealthy ] && { echo "::error::le conteneur est unhealthy"; exit 1; }
            sleep 5
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' nfl-pronos)" = healthy ] \
            || { echo "::error::le conteneur n'est jamais devenu healthy"; exit 1; }

          # `pull` peut ne rien faire sans le dire (image deja presente en local).
          # On verifie donc que c'est bien la version attendue qui tourne.
          en_place=$(docker inspect -f '{{.Config.Image}}' nfl-pronos)
          echo "image deployee : $en_place"
          case "$en_place" in
            *":$IMAGE_TAG") ;;
            *) echo "::error::le conteneur tourne sur $en_place, attendu ...:$IMAGE_TAG"; exit 1 ;;
          esac
          DISTANT
          } | ssh -i ~/.ssh/id_deploiement -p "$VPS_PORT" \
                -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
                "$VPS_USER@$VPS_HOST" \
                "APP_DIR='$APP_DIR' COMPOSE='$COMPOSE' IMAGE_TAG='$IMAGE_TAG' GHCR_USER='$GHCR_USER' bash -euo pipefail -s"

      - name: Attendre que l'URL publique reponde
        # Le conteneur est healthy vu de l'interieur ; ce tour de boucle verifie
        # le chemin complet, reverse proxy et TLS compris.
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$BASE_URL/api/health" | grep -q '"ok":true'; then
              echo "sante publique : ok"
              exit 0
            fi
            echo "tentative $i : pas encore"
            sleep 5
          done
          echo "::error::$BASE_URL/api/health ne repond pas — reverse proxy ou DNS ?"
          exit 1

      - name: Verifier qu'un formulaire est accepte
        # Meme controle que le job « fumee », mais contre l'URL publique : c'est
        # la seule facon de voir que le reverse proxy et ORIGIN s'accordent. Sans
        # ORIGIN correct, adapter-node reconstitue l'origine en http:// depuis
        # l'en-tete Host recu du proxy et la verification CSRF rejette *tous* les
        # formulaires en 403. Un GET ne le voit pas, seul un POST le montre.
        #
        # L'adresse n'existe pas et le TLD .invalid n'est pas routable : l'action
        # repond la meme chose qu'un compte existe ou non, aucun mail ne part.
        # Seuls les compteurs en memoire du rate limiter bougent, et ils viennent
        # d'etre remis a zero par le redemarrage.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$BASE_URL/connexion?/lien" \
            -H "Origin: $BASE_URL" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'email=deploiement@example.invalid')
          echo "POST /connexion?/lien -> $code"
          [ "$code" = 403 ] && { echo "::error::CSRF rejette les formulaires : ORIGIN correspond-il a $BASE_URL ?"; exit 1; }
          # 429 : la limite de debit a repondu, donc la requete avait deja franchi
          # le controle CSRF — ce qu'on cherchait a savoir. Arrive a partir de
          # quatre deploiements dans le meme quart d'heure.
          [ "$code" = 429 ] && { echo "::warning::limite de debit atteinte ; le controle CSRF est neanmoins passe"; exit 0; }
          [ "$code" = 200 ] || { echo "::error::attendu 200, obtenu $code"; exit 1; }

      - name: Journal du conteneur
        if: failure()
        run: |
          ssh -i ~/.ssh/id_deploiement -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && docker compose -f '$COMPOSE' logs --tail=60 app" || true

      - name: Recapitulatif
        if: always()
        run: |
          {
            echo "### Deploiement"
            echo ""
            echo "- image : \`${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- cible : \`${APP_DIR}\` sur le VPS"
            echo "- url : ${BASE_URL}"
            echo ""
            echo "Retour arriere, depuis \`${APP_DIR}\` sur le VPS :"
            echo ""
            echo '```bash'
            echo "cp .env.avant-deploiement .env"
            echo "docker compose -f ${COMPOSE} up -d"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Effacer la cle
        if: always()
        run: rm -f ~/.ssh/id_deploiement
